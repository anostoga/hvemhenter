# Fly.io-konfigurasjon for backend. Billigste oppsett: delt CPU, minimalt minne.
# Postgres-tilkobling (Supabase) settes som secret, ikke i denne filen:
#   fly secrets set DATABASE_URL=... DATABASE_PASSWORD=... TOKEN_ENCRYPTION_KEY=... \
#     STATE_SIGNING_SECRET=... SESSION_SIGNING_SECRET=... FAMILY_CREATION_CODE=...
app = "barnehage-backend"
primary_region = "arn" # Stockholm — bytt til nærmeste region ved behov

[build]

[env]
  PORT = "8080"
  SESSION_COOKIE_SECURE = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
