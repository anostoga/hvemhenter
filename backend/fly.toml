# Fly.io-konfigurasjon for backend. Billigste oppsett: delt CPU, minimalt minne,
# ett persistent volum for SQLite-filen (tokens + tildelingshistorikk).
app = "barnehage-backend"
primary_region = "arn" # Stockholm — bytt til nærmeste region ved behov

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/barnehage.db"

[[mounts]]
  source = "barnehage_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
